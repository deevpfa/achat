name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: achat.py · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: ubuntu-22.04, python: "3.8" } # oldest supported version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (stdlib only, no network, no models)
        run: python -m unittest discover -s tests -v

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Integration tests inside VS Code (virtual display)
        run: xvfb-run -a npm run test:integration
      - name: Package
        run: npx vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: achat-vsix
          path: extensions/vscode/*.vsix
