name: Release extension

# Push a tag like v0.3.0 to publish. Each store is skipped (not failed) until its
# token exists as a repository secret, so this is safe to have before the accounts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Tag must match the extension version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npx vsce package --no-dependencies
      # The GitHub release comes first: it exists even if a store rejects the upload.
      - name: Attach the .vsix to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" *.vsix --title "${GITHUB_REF_NAME}" --generate-notes
      - name: Publish to the VS Code Marketplace (VS Code)
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath *.vsix
      - name: Publish to Open VSX (Cursor, Windsurf, Antigravity, VSCodium)
        if: env.OVSX_PAT != ''
        run: |
          PUB="$(node -p 'require("./package.json").publisher')"
          # The first publication needs the namespace. "Already exists" is fine; any other
          # failure (e.g. publisher agreement not signed) is shown and stops the job.
          if ! out="$(npx --yes ovsx create-namespace "$PUB" 2>&1)"; then
            echo "$out"
            echo "$out" | grep -qi "already exists" || exit 1
          fi
          npx --yes ovsx publish *.vsix
